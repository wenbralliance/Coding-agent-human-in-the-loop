<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Coding Agent</title>
<style>
    :root {
        --bg: #ffffff; --sidebar: #f9f9f9; --border: #e5e5e5;
        --text: #111111; --muted: #888888; --hover: #ececec; --accent: #000000;
    }
    * { box-sizing: border-box; }
    body {
        margin: 0; display: flex; height: 100vh; width: 100vw;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: var(--bg); color: var(--text); overflow: hidden;
    }

    /* 左侧栏 */
    #sidebar {
        width: 260px; background: var(--sidebar); border-right: 1px solid var(--border);
        display: flex; flex-direction: column; padding: 12px; flex-shrink: 0;
    }
    .btn-new {
        background: #fff; border: 1px solid var(--border); border-radius: 6px;
        padding: 10px 12px; font-size: 14px; font-weight: 500; cursor: pointer;
        display: flex; align-items: center; gap: 8px; transition: 0.2s; margin-bottom: 16px;
    }
    .btn-new:hover { background: var(--hover); }

    .sidebar-section {
        font-size: 11px; font-weight: 600; color: var(--muted);
        margin: 12px 12px 8px; text-transform: uppercase; letter-spacing: 0.5px;
    }

    #session-list { flex: 1; overflow-y: auto; }
    .session-item {
        padding: 10px 12px; font-size: 13px; cursor: pointer; border-radius: 6px;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        color: #333; margin-bottom: 2px;
    }
    .session-item:hover { background: var(--hover); }
    .session-item.active { background: #e5e5e5; font-weight: 500; color: #000; }

    .workspace-info {
        padding: 10px 12px; font-size: 12px; color: #333; word-break: break-all;
        background: #fff; border: 1px solid var(--border); border-radius: 6px; margin-bottom: 12px;
    }

    .sidebar-footer {
        padding: 12px; font-size: 14px; cursor: pointer; border-radius: 6px;
        display: flex; align-items: center; gap: 8px; color: var(--text); font-weight: 500;
    }
    .sidebar-footer:hover { background: var(--hover); }

    /* 右侧主区 */
    #main { flex: 1; display: flex; flex-direction: column; position: relative; overflow: hidden; }
    #chat-container {
        flex: 1; overflow-y: auto; padding: 40px 20px; display: flex;
        flex-direction: column; gap: 24px; max-width: 800px; margin: 0 auto; width: 100%;
    }

    #empty-state {
        display: flex; flex-direction: column; align-items: center;
        justify-content: center; height: 100%; font-size: 22px; font-weight: 500;
        pointer-events: none;
    }

    .msg { display: flex; gap: 16px; width: 100%; }
    .msg-avatar { width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0; }
    .msg.user .msg-avatar { background: #000; color: #fff; }
    .msg.agent .msg-avatar { background: #e5e5e5; color: #000; }
    .msg-content { font-size: 15px; line-height: 1.6; color: #222; white-space: pre-wrap; word-break: break-word; padding-top: 4px;}
    .msg.error .msg-content { color: #d93025; }

    /* 底部输入区 */
    #input-container { padding: 20px; max-width: 800px; margin: 0 auto; width: 100%; flex-shrink: 0; }
    .input-box {
        background: #fff; border: 1px solid var(--border); border-radius: 12px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.05); display: flex; flex-direction: column; overflow: hidden;
    }
    .input-box:focus-within { border-color: var(--accent); }
    textarea {
        width: 100%; border: none; outline: none; resize: none; padding: 16px;
        font-size: 15px; font-family: inherit; min-height: 60px;
    }
    .input-footer { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; background: #fafafa; border-top: 1px solid var(--border);}
    .btn-send { width: 32px; height: 32px; border-radius: 50%; background: #ccc; color: #fff; border: none; display: flex; align-items: center; justify-content: center; transition: background 0.2s; }
    .btn-send.active { background: var(--accent); cursor: pointer; }

    /* 弹窗 */
    .modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.4); justify-content: center; align-items: center; z-index: 100; backdrop-filter: blur(2px);}
    .modal { background: #fff; border-radius: 12px; width: 400px; padding: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
    .form-group { margin-bottom: 16px; margin-top: 16px;}
    .form-group label { display: block; margin-bottom: 8px; font-size: 13px; font-weight: 500;}
    .form-group input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; outline: none;}
    .modal-actions { display: flex; justify-content: flex-end; gap: 12px; margin-top: 24px; }
    .btn-secondary { background: #eee; color: #333; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer;}
    .btn-primary { background: #000; color: #fff; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer;}

    /* HITL 审批弹窗 */
    .approval-box { background: #fff; border-radius: 12px; width: 600px; max-width: 90vw; padding: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); display: flex; flex-direction: column; }
    .approval-box h3 { margin-top: 0; font-size: 18px; display: flex; align-items: center; gap: 8px; }
    .approval-code { background: #1e1e1e; color: #d4d4d4; padding: 16px; border-radius: 8px; font-family: monospace; font-size: 13px; max-height: 300px; overflow-y: auto; white-space: pre-wrap; margin-bottom: 20px;}
    .approval-actions { display: flex; justify-content: flex-end; gap: 12px; }
    .btn-approve { background: #10b981; color: white; border: none; padding: 10px 24px; border-radius: 6px; cursor: pointer; font-weight: bold;}
    .btn-reject { background: #ef4444; color: white; border: none; padding: 10px 24px; border-radius: 6px; cursor: pointer; font-weight: bold;}
</style>
</head>
<body>
    <div id="sidebar">
        <button class="btn-new" onclick="newChat()">+ New Chat</button>
        <div class="sidebar-section">History</div>
        <div id="session-list"></div>
        <div class="sidebar-section" style="margin-top: auto;">Workspace</div>
        <div class="workspace-info" id="current-workspace">加载中...</div>
        <div class="sidebar-footer" onclick="openSettings()">
            ⚙️ Settings
        </div>
    </div>

    <div id="main">
        <div id="chat-container">
            <div id="empty-state">
                <div style="font-size: 40px; margin-bottom: 16px;">✧</div>
                What should we build today?
            </div>
        </div>

        <div id="input-container">
            <div class="input-box">
                <textarea id="user-input" placeholder="Do anything..."></textarea>
                <div class="input-footer">
                    <span style="font-size:13px; color:#666;">🤖 Coding Agent</span>
                    <button id="send-btn" class="btn-send" onclick="sendMessage()">↑</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 设置弹窗 -->
    <div id="modal-overlay" class="modal-overlay">
        <div class="modal">
            <h3 style="margin:0;">⚙️ Settings</h3>
            <div class="form-group">
                <label>LLM API Key (DeepSeek)</label>
                <input type="password" id="set-llm-key" placeholder="sk-...">
            </div>
            <div class="form-group">
                <label>Embedding API Key (DashScope)</label>
                <input type="password" id="set-emb-key" placeholder="sk-...">
            </div>
            <div class="form-group">
                <label>Workspace Path</label>
                <div style="display: flex; gap: 8px;">
                    <input type="text" id="set-workspace" placeholder="绝对路径" style="flex: 1;">
                    <button onclick="selectWorkspaceNative()" style="padding: 0 12px; border-radius: 6px; border:1px solid #ccc; cursor:pointer;">浏览</button>
                </div>
            </div>
            <div class="modal-actions">
                <button class="btn-secondary" onclick="closeSettings()">Cancel</button>
                <button class="btn-primary" onclick="saveSettings()">Save</button>
            </div>
        </div>
    </div>

    <!-- HITL 审批弹窗 -->
    <div id="approval-modal" class="modal-overlay">
        <div class="approval-box">
            <h3>🛡️ 安全拦截：Agent 请求执行代码</h3>
            <p style="color: #666; font-size: 14px; margin-bottom: 16px;">
                目标文件：<code id="approval-filename" style="background:#eee;padding:2px 6px;border-radius:4px;"></code>
            </p>
            <div class="approval-code" id="approval-code"></div>
            <div class="approval-actions">
                <button class="btn-reject" onclick="submitApproval('reject')">拒绝</button>
                <button class="btn-approve" onclick="submitApproval('approve')">批准执行</button>
            </div>
        </div>
    </div>

    <script>
        const chatContainer = document.getElementById('chat-container');
        const inputEl = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const sessionListEl = document.getElementById('session-list');
        let sessionId = "";

        inputEl.addEventListener('input', () => {
            inputEl.style.height = 'auto';
            inputEl.style.height = (inputEl.scrollHeight) + 'px';
            sendBtn.classList.toggle('active', !!inputEl.value.trim());
        });

        // 历史记录
        async function loadSessions() {
            try {
                const res = await fetch('/api/sessions');
                if (!res.ok) return;
                const sessions = await res.json();
                sessionListEl.innerHTML = '';
                sessions.forEach(s => {
                    const div = document.createElement('div');
                    div.className = `session-item ${s.id === sessionId ? 'active' : ''}`;
                    div.textContent = s.title;
                    div.title = s.title;
                    div.onclick = () => switchSession(s.id);
                    sessionListEl.appendChild(div);
                });
            } catch (e) { console.error("加载历史失败", e); }
        }

        async function switchSession(id) {
            sessionId = id;
            localStorage.setItem('current_session_id', id);
            loadSessions();
            chatContainer.innerHTML = '';
            try {
                const res = await fetch(`/api/sessions/${id}/messages`);
                const msgs = await res.json();
                if (msgs.length === 0) {
                    chatContainer.innerHTML = `<div id="empty-state"><div style="font-size: 40px; margin-bottom: 16px;">✧</div>What should we build today?</div>`;
                } else {
                    msgs.forEach(m => {
                        const isUser = m.role === 'user';
                        const div = document.createElement('div');
                        div.className = `msg ${isUser ? 'user' : 'agent'}`;
                        div.innerHTML = `<div class="msg-avatar">${isUser ? 'U' : 'AI'}</div><div class="msg-content">${m.content}</div>`;
                        chatContainer.appendChild(div);
                    });
                }
                chatContainer.scrollTop = chatContainer.scrollHeight;
            } catch(e) { console.error(e); }
        }

        async function newChat() {
            sessionId = "s_" + Math.random().toString(36).slice(2, 10);
            localStorage.setItem('current_session_id', sessionId);
            chatContainer.innerHTML = `<div id="empty-state"><div style="font-size: 40px; margin-bottom: 16px;">✧</div>What should we build today?</div>`;

            // 👇 通知后端马上建一个空会话
            await fetch('/api/sessions', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ session_id: sessionId })
            });

            loadSessions(); // 立刻刷新左侧
        }

        // 设置
        async function loadSettings() {
            try {
                const res = await fetch('/api/settings');
                const data = await res.json();
                document.getElementById('current-workspace').textContent = data.WORKSPACE_PATH || '未配置';
                if (data.LLM_API_KEY) document.getElementById('set-llm-key').placeholder = data.LLM_API_KEY;
                if (data.EMBEDDING_API_KEY) document.getElementById('set-emb-key').placeholder = data.EMBEDDING_API_KEY;
                if (data.WORKSPACE_PATH) document.getElementById('set-workspace').value = data.WORKSPACE_PATH;
            } catch (e) { console.error(e); }
        }
        function openSettings() { document.getElementById('modal-overlay').style.display = 'flex'; }
        function closeSettings() { document.getElementById('modal-overlay').style.display = 'none'; }
        async function selectWorkspaceNative() {
            if (window.electronAPI) {
                const dir = await window.electronAPI.selectDirectory();
                if (dir) document.getElementById('set-workspace').value = dir;
            }
        }
        async function saveSettings() {
            const payload = {
                llm_api_key: document.getElementById('set-llm-key').value || null,
                embedding_api_key: document.getElementById('set-emb-key').value || null,
                workspace_path: document.getElementById('set-workspace').value || null
            };
            await fetch('/api/settings', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload) });
            alert('保存成功！'); closeSettings(); loadSettings();
        }

        // 聊天
        async function sendMessage() {
            const text = inputEl.value.trim();
            if (!text) return;
            inputEl.value = ''; inputEl.style.height = 'auto'; sendBtn.classList.remove('active');
            const es = document.getElementById('empty-state');
            if(es) es.style.display = 'none';

            const userDiv = document.createElement('div');
            userDiv.className = 'msg user';
            userDiv.innerHTML = `<div class="msg-avatar">U</div><div class="msg-content">${text}</div>`;
            chatContainer.appendChild(userDiv);

            const agentDiv = document.createElement('div');
            agentDiv.className = 'msg agent';
            agentDiv.innerHTML = `<div class="msg-avatar">AI</div><div class="msg-content">思考中...</div>`;
            chatContainer.appendChild(agentDiv);
            const contentDiv = agentDiv.querySelector('.msg-content');
            chatContainer.scrollTop = chatContainer.scrollHeight;

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ session_id: sessionId, message: text })
                });
                await processStream(response, agentDiv, contentDiv);
                loadSessions();
            } catch (e) {
                contentDiv.textContent = '请求失败: ' + e.message;
            }
        }

        async function processStream(response, agentDiv, contentDiv) {
            const reader = response.body.getReader();
            const decoder = new TextDecoder();
            let buffer = '';

            while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                buffer += decoder.decode(value, { stream: true });
                const lines = buffer.split('\n\n'); buffer = lines.pop();

                for (const line of lines) {
                    if (!line.startsWith('data: ')) continue;
                    const data = JSON.parse(line.slice(6));

                    if (data.type === 'text') {
                        if (contentDiv.textContent === '思考中...') contentDiv.textContent = '';
                        contentDiv.textContent += data.content;
                    } else if (data.type === 'tool_end') {
                        const toolDiv = document.createElement('div');
                        toolDiv.className = 'tool-status';
                        toolDiv.innerHTML = `✅ 工具执行完成`;
                        agentDiv.insertBefore(toolDiv, contentDiv);
                        contentDiv.textContent = '继续思考中...';
                    } else if (data.type === 'interrupt') {
                        // 👇 捕获人工审批，停止“思考中”，弹窗！
                        contentDiv.textContent = '⏸️ 等待人工审批...';

                        document.getElementById('approval-filename').textContent = data.data.filename;
                        document.getElementById('approval-code').textContent = data.data.code;
                        document.getElementById('approval-modal').style.display = 'flex';

                        // 中断后立即断开当前 reader，等待审批结果后再发新请求
                        return;
                    } else if (data.type === 'error') {
                        contentDiv.textContent = `[错误] ${data.content}`;
                    }
                    chatContainer.scrollTop = chatContainer.scrollHeight;
                }
            }
        }

        async function submitApproval(action) {
            document.getElementById('approval-modal').style.display = 'none';
            const agentDivs = document.querySelectorAll('.msg.agent');
            const lastAgentDiv = agentDivs[agentDivs.length - 1];
            const contentDiv = lastAgentDiv.querySelector('.msg-content');

            try {
                const response = await fetch('/api/approve', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ session_id: sessionId, action: action })
                });
                await processStream(response, lastAgentDiv, contentDiv);
            } catch (e) {
                contentDiv.textContent = '请求失败: ' + e.message;
            }
        }

        async function init() {
            await loadSettings();
            const savedId = localStorage.getItem('current_session_id');
            if (savedId) switchSession(savedId);
            else newChat();
            loadSessions();
        }

        inputEl.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
        });

        init();
    </script>
</body>
</html>
