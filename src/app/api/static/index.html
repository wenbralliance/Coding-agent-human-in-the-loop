<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Coding Agent</title>
<style>
    /* 基础样式保留，新增侧边栏和弹窗样式 */
    :root {
        --bg: #1e1e1e; --sidebar: #252526; --text: #d4d4d4;
        --user: #007acc; --agent: #2d2d2d; --tool: #4ec9b0;
        --border: #333; --danger: #f87171;
    }
    body { background: var(--bg); color: var(--text); font-family: sans-serif; margin: 0; display: flex; height: 100vh; overflow: hidden; }

    /* 侧边栏 */
    #sidebar { width: 240px; background: var(--sidebar); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
    .sidebar-header { padding: 16px; border-bottom: 1px solid var(--border); font-weight: bold; }
    .sidebar-item { padding: 12px 16px; cursor: pointer; border-bottom: 1px solid var(--border); font-size: 14px; }
    .sidebar-item:hover { background: #333; }
    .sidebar-footer { margin-top: auto; padding: 16px; border-top: 1px solid var(--border); cursor: pointer; color: #aaa; }
    .sidebar-footer:hover { color: white; }

    /* 主聊天区 */
    #main { flex: 1; display: flex; flex-direction: column; }
    #chat-container { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 16px; }
    .msg { max-width: 85%; line-height: 1.6; padding: 12px 16px; border-radius: 8px; white-space: pre-wrap; }
    .msg.user { align-self: flex-end; background: var(--user); color: white; }
    .msg.agent { align-self: flex-start; background: var(--agent); border: 1px solid var(--border); }
    .msg.error { background: rgba(248, 113, 113, 0.1); border-color: var(--danger); color: var(--danger); }
    .tool-status { align-self: flex-start; font-size: 13px; color: var(--tool); background: rgba(78,201,176,0.1); padding: 8px 12px; border-left: 3px solid var(--tool); display: flex; gap: 8px; align-items: center; }
    .spinner { width: 12px; height: 12px; border: 2px solid var(--tool); border-top-color: transparent; border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* 输入区 */
    #input-area { padding: 20px; border-top: 1px solid var(--border); background: var(--sidebar); }
    .input-wrapper { display: flex; background: #3c3c3c; border-radius: 8px; border: 1px solid #555; }
    textarea { flex: 1; background: transparent; border: none; color: white; padding: 12px; outline: none; resize: none; height: 24px; }
    button { background: var(--user); color: white; border: none; padding: 0 20px; cursor: pointer; font-weight: bold; }

    /* 弹窗 */
    #modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 100; }
    .modal { background: var(--sidebar); border: 1px solid var(--border); border-radius: 8px; width: 400px; padding: 20px; }
    .modal h3 { margin-top: 0; }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; margin-bottom: 6px; font-size: 13px; color: #aaa; }
    .form-group input { width: 100%; padding: 8px; background: #1e1e1e; border: 1px solid #444; color: white; border-radius: 4px; box-sizing: border-box; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }
    .btn-secondary { background: #444; }
</style>
</head>
<body>
    <!-- 侧边栏 -->
    <div id="sidebar">
        <div class="sidebar-header">Coding Agent</div>
        <div class="sidebar-item" style="color:#aaa; cursor:default">工作区: <span id="current-workspace">加载中...</span></div>
        <div class="sidebar-footer" onclick="openSettings()">⚙️ 设置与配置</div>
    </div>

    <!-- 主区 -->
    <div id="main">
        <div id="chat-container">
            <div class="msg agent">你好！我是你的 Coding Agent。请先在左下角“设置”中配置 API Key 和工作区。</div>
        </div>
        <div id="input-area">
            <div class="input-wrapper">
                <textarea id="user-input" placeholder="输入任务 (Enter 发送)..." rows="1"></textarea>
                <button id="send-btn" onclick="sendMessage()">发送</button>
            </div>
        </div>
    </div>

    <!-- 设置弹窗 -->
    <div id="modal-overlay">
        <div class="modal">
            <h3>⚙️ 系统配置</h3>
            <div class="form-group">
                <label>LLM API Key (DeepSeek)</label>
                <input type="password" id="set-llm-key" placeholder="sk-...">
            </div>
            <div class="form-group">
                <label>Embedding API Key (DashScope)</label>
                <input type="password" id="set-emb-key" placeholder="sk-...">
            </div>
            <div class="form-group">
                <label>工作区目录 (Workspace)</label>
                <input type="text" id="set-workspace" placeholder="workspace 或绝对路径">
            </div>
            <div class="modal-actions">
                <button class="btn-secondary" onclick="closeSettings()">取消</button>
                <button onclick="saveSettings()">保存并重启</button>
            </div>
        </div>
    </div>

    <script>
        const chatContainer = document.getElementById('chat-container');
        let sessionId = localStorage.getItem('session_id') || "s_" + Math.random().toString(36).slice(2, 10);

        // 初始化：加载配置
        async function loadSettings() {
            try {
                const res = await fetch('/api/settings');
                const data = await res.json();
                document.getElementById('current-workspace').textContent = data.WORKSPACE_PATH || '未设置';
                // 为了安全，只回显蒙版后的 Key
                if (data.LLM_API_KEY) document.getElementById('set-llm-key').placeholder = data.LLM_API_KEY;
                if (data.EMBEDDING_API_KEY) document.getElementById('set-emb-key').placeholder = data.EMBEDDING_API_KEY;
                if (data.WORKSPACE_PATH) document.getElementById('set-workspace').value = data.WORKSPACE_PATH;
            } catch (e) {
                console.error('加载配置失败', e);
            }
        }

        function openSettings() { document.getElementById('modal-overlay').style.display = 'flex'; }
        function closeSettings() { document.getElementById('modal-overlay').style.display = 'none'; }

        async function saveSettings() {
            const payload = {
                llm_api_key: document.getElementById('set-llm-key').value || null,
                embedding_api_key: document.getElementById('set-emb-key').value || null,
                workspace_path: document.getElementById('set-workspace').value || null
            };
            try {
                const res = await fetch('/api/settings', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(payload)
                });
                if (res.ok) {
                    alert('保存成功！由于底层配置已更新，请手动重启后端服务生效。');
                    closeSettings();
                    loadSettings();
                }
            } catch (e) {
                alert('保存失败: ' + e.message);
            }
        }

        // 聊天逻辑（略，和之前一样）
        async function sendMessage() {
            const inputEl = document.getElementById('user-input');
            const text = inputEl.value.trim();
            if (!text) return;
            inputEl.value = '';

            const userDiv = document.createElement('div');
            userDiv.className = 'msg user'; userDiv.textContent = text;
            chatContainer.appendChild(userDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;

            const agentDiv = document.createElement('div');
            agentDiv.className = 'msg agent'; agentDiv.textContent = '思考中...';
            chatContainer.appendChild(agentDiv);

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ session_id: sessionId, message: text })
                });

                agentDiv.textContent = ''; // 清空“思考中”
                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split('\n\n'); buffer = lines.pop();

                    for (const line of lines) {
                        if (!line.startsWith('data: ')) continue;
                        const data = JSON.parse(line.slice(6));
                        if (data.type === 'text') {
                            agentDiv.textContent += data.content;
                        } else if (data.type === 'tool_start') {
                            const toolDiv = document.createElement('div');
                            toolDiv.className = 'tool-status';
                            toolDiv.innerHTML = `<div class="spinner"></div><span>执行工具: ${data.name}</span>`;
                            chatContainer.insertBefore(toolDiv, agentDiv);
                        } else if (data.type === 'error') {
                            agentDiv.className = 'msg error';
                            agentDiv.textContent += `[错误] ${data.content}`;
                        }
                        chatContainer.scrollTop = chatContainer.scrollHeight;
                    }
                }
            } catch (e) {
                agentDiv.textContent = '请求失败: ' + e.message;
            }
        }

        // 启动时加载
        loadSettings();
        document.getElementById('user-input').addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
        });
    </script>
</body>
</html>
